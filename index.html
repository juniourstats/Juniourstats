<body>
<div class="brand"><span class="ball"></span><b>junior stats</b><small class="ver">v7</small></div>
<div class="nav" id="nav"></div>
<div id="view"></div>
<div id="rep"></div>
<script>
const G=[["m2l","m2s","x2l","x2s","m3","x3","ftm","ftx","dr","or","as","st","pf","tdt","ttr","sec"]];
const KEYS=G[0];
let S={players:[],court:[null,null,null,null,null],sel:null,tab:"live",mode:"+",subSlot:null,fname:"junior stats"};
try{const x=JSON.parse(localStorage.getItem("bara3em"));if(x&&Array.isArray(x.players))Object.assign(S,x)}catch(e){}
let cloudDoc=null,cloudT=null;
const save=()=>{
  const at=Date.now();
  try{localStorage.setItem("bara3em",JSON.stringify(S));localStorage.setItem("bara3em_at",String(at))}catch(e){}
  if(cloudDoc){clearTimeout(cloudT);cloudT=setTimeout(()=>{cloudDoc.set({json:JSON.stringify(S),at}).catch(()=>{})},700)}
};
const blank=()=>Object.fromEntries(KEYS.map(k=>[k,0]));
let _n=0;
const P=id=>S.players.find(p=>p.id===id);
function norm(){
S.players.forEach(p=>{if(!p.id)p.id=Date.now()+(_n++);KEYS.forEach(k=>{if(typeof p.s[k]!=="number")p.s[k]=0})});
if(!Array.isArray(S.court)||S.court.length!==5)S.court=[null,null,null,null,null];
S.court=S.court.map(id=>P(id)?id:null);
if(S.court.every(x=>!x))S.players.slice(0,5).forEach((p,i)=>S.court[i]=p.id);
if(!P(S.sel))S.sel=S.court.find(x=>x)||null;
if(!S.timer||typeof S.timer.len!=="number")S.timer={len:600,left:600,running:false};
S.timer.running=false;S.clkOpen=false;S.detail=null;S.players.forEach(p=>{if(!Array.isArray(p.log))p.log=[]});
if(!["live","roster","report"].includes(S.tab))S.tab="live";
if(S.fname==="إحصائيات البراعم")S.fname="junior stats";
S.subSlot=null;S.mode="+";
}
norm();
const pct=(a,b)=>b?Math.round(a/b*100)+"%":"-";
function totals(s){
  const m2=s.m2l+s.m2s,a2=m2+s.x2l+s.x2s,a3=s.m3+s.x3,aft=s.ftm+s.ftx,fgm=m2+s.m3,fga=a2+a3;
  return {pts:m2*2+s.m3*3+s.ftm,m2,a2,m3:s.m3,a3,ftm:s.ftm,aft,fgm,fga,reb:s.dr+s.or,to:s.tdt+s.ttr,as:s.as,st:s.st,pf:s.pf}
}
const H=["رقم","الاسم","الوقت","نقاط","2 صح Layup","2 صح Shoot","2 غلط Layup","2 غلط Shoot","3 صح","3 غلط","حرة صح","حرة غلط","Dr","Or","Reb","As","St","Pf","Double Dribble","Travel","TO"];
const rowv=(n,nm,s)=>{const t=totals(s);return [n,nm,nm==="الفريق"?"-":fmt(s.sec||0),t.pts,s.m2l,s.m2s,s.x2l,s.x2s,s.m3,s.x3,s.ftm,s.ftx,s.dr,s.or,t.reb,s.as,s.st,s.pf,s.tdt,s.ttr,t.to]};
const teamS=()=>Object.fromEntries(KEYS.map(k=>[k,S.players.reduce((a,p)=>a+(p.s[k]||0),0)]));
const allRows=()=>{const r=S.players.map(p=>rowv(p.no,p.name,p.s));r.push(rowv("","الفريق",teamS()));return r};
const fname=()=>((S.fname||"").trim().replace(/[\\\/:*?"<>|]+/g,"-")||"إحصائيات");
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function go(t){S.tab=t;S.subSlot=null;S.detail=null;save();render()}
function selP(id){S.sel=id;S.subSlot=null;save();render()}
function setMode(m){S.mode=m;render()}
function bump(k){const p=P(S.sel);if(!p)return;p.s[k]=Math.max(0,p.s[k]+(S.mode==="-"?-1:1));save();render()}
function openSub(i){S.subSlot=S.subSlot===i?null:i;render()}
function doSub(id){S.court[S.subSlot]=id;S.sel=id;S.subSlot=null;save();render()}
function toBench(){S.court[S.subSlot]=null;if(S.sel&&!S.court.includes(S.sel))S.sel=S.court.find(x=>x)||null;S.subSlot=null;save();render()}
function addP(){

const PAD=[["m2l","2 صح","Layup","g"],["m2s","2 صح","Shoot","g"],["m3","3 نقاط","صح","g"],["x2l","2 غلط","Layup","r"],["x2s","2 غلط","Shoot","r"],["x3","3 نقاط","غلط","r"],["ftm","رمية حرة","صح","g"],["ftx","رمية حرة","غلط","r"],null,["dr","ريبوند","Dr دفاعي",""],["or","ريبوند","Or هجومي",""],["as","تمريرة","As",""],["st","سرقة","St",""],["pf","خطأ","Pf",""],["tdt","Turnover","Double Dribble",""],["ttr","Turnover","Travel",""]];


/* ===== player characters + court ===== */
function look(id){
  let x=(Math.abs(+id)%2147483646)+1;const r=n=>{x=(x*48271)%2147483647;return x%n};r(1);r(1);r(1);
  const SK=["#f3d2b3","#e0ac7e","#c68642","#8d5524","#5a3825"],HR=["#1b1b1b","#3b2a1d","#6b4423","#c9a227","#2b2b2b"],JS=["#d0306a","#0f8a7e","#3b5bdb","#f59f00","#7048e8","#e8590c","#2b8a3e","#c92a2a"];
  return {sk:SK[r(5)],hr:HR[r(5)],js:JS[r(8)],st:r(4)};
}
function board(){
  const t=totals(teamS());
  return `<div class="board"><div><span>نقاط الفريق</span><b>${t.pts}</b></div><div><span>ريبوند</span><b>${t.reb}</b></div><div><span>أخطاء</span><b>${teamS().pf}</b></div></div>`;

/* ===== game clock + minutes played ===== */
const fmt=s=>{s=Math.max(0,Math.round(s||0));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};
let LAST=0,SAVEAT=0;
function clockHtml(){
  const T=S.timer;
  let h=`<div class="clock ${T.running?"run":""}"><button onclick="clkPanel()" aria-label="تغيير الوقت">⚙</button><div id="clk" onclick="clkEdit()" class="${T.left<=10?"low":""}">${fmt(T.left)}</div><button class="${T.running?"":"go"}" onclick="clkToggle()">${T.running?"⏸":"▶"}</button><button onclick="clkReset()">↺</button></div>`;
  if(S.clkOpen)h+=`<div class="cpanel"><h3>مدة التايمر</h3><div class="chips">${[1,2,3,5,8,10,12,15,20,30,45,60].map(m=>`<button class="chip ${m*60===T.len?"on":""}" onclick="clkPreset(${m})">${m} د</button>`).join("")}</div><div class="row"><input id="cm" class="n" placeholder="دقايق" inputmode="decimal"><button class="btn" onclick="clkCustom()">ضبط</button><button class="btn g" onclick="clkAdj(-1)">−1 د</button><button class="btn g" onclick="clkAdj(1)">+1 د</button></div></div>`;
  return h;
}
function clkPanel(){S.clkOpen=!S.clkOpen;render()}
function clkApply(sec){if(!(sec>0))return;const T=S.timer;T.len=sec;T.left=sec;T.running=false;S.clkOpen=false;save();render()}
function clkPreset(m){clkApply(m*60)}
function clkCustom(){const v=document.getElementById("cm").value;if(!v.trim())return;clkApply(parseT(v))}
function clkAdj(d){const T=S.timer;T.left=Math.max(0,T.left+d*60);if(T.left>T.len)T.len=T.left;LAST=Date.now();save();render()}
function clkToggle(){const T=S.timer;if(T.left<=0)T.left=T.len;T.running=!T.running;LAST=Date.now();save();render()}
function clkSet(){clkPanel()}
function clkReset(){const T=S.timer;if(T.running||T.left!==T.len){T.left=T.len;T.running=false;save();render()}}
setInterval(()=>{
  const T=S.timer;if(!T.running)return;
  const now=Date.now();let dt=(now-LAST)/1000;LAST=now;dt=Math.min(dt,T.left);T.left-=dt;
  S.court.forEach(id=>{const p=id&&P(id);if(p)p.s.sec=(p.s.sec||0)+dt});
  const c=document.getElementById("clk");if(c){c.textContent=fmt(T.left);c.className=T.left<=10?"low":""}
  document.querySelectorAll("[data-t]").forEach(e=>{const p=P(+e.getAttribute("data-t"));if(p)e.textContent=fmt(p.s.sec)});
  if(T.left<=0.001){T.left=0;T.running=false;save();render();try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(e){}toast("انتهى الوقت ⏱");return}
  if(now-SAVEAT>2000){SAVEAT=now;save()}
},250);

function parseT(v){
  const m=String(v).trim().replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d));
  if(m.includes(":")){const q=m.split(":");return (+q[0]||0)*60+(+q[1]||0)}
  return Math.round((parseFloat(m)||0)*60);
}
function clkEdit(){const T=S.timer;ask("عدّل الوقت الباقي (دقيقة:ثانية)",fmt(T.left),v=>{const sec=parseT(v);if(sec<0||isNaN(sec))return;T.left=sec;if(sec>T.len)T.len=sec;LAST=Date.now();save();render()})}
function tmEdit(id){const p=P(id);if(!p)return;ask("وقت لعب "+(p.name||p.no)+" (دقيقة:ثانية)",fmt(p.s.sec),v=>{const sec=parseT(v);if(sec<0||isNaN(sec))return;p.s.sec=sec;save();render()})}

/* ===== per-player action log ===== */
const lbl=k=>{const b=PAD.find(x=>x&&x[0]===k);return b?b[1]+" "+b[2]:k};
const lcls=k=>{const b=PAD.find(x=>x&&x[0]===k);return b?b[3]:""};
function showP(id){S.detail=id;render()}
function closeP(){S.detail=null;render()}
function keepRender(){const sh=document.querySelector(".sheet"),st=sh?sh.scrollTop:0;render();const n=document.querySelector(".sheet");if(n)n.scrollTop=st}
function undoLog(id,i){const p=P(id);if(!p||!p.log[i])return;const e=p.log[i];p.s[e.k]=Math.max(0,p.s[e.k]-1);p.log.splice(i,1);save();keepRender()}
function adjStat(id,k,d){
  const p=P(id);if(!p)return;const LG=p.log||(p.log=[]);
  if(d<0){if(!p.s[k])return;p.s[k]-=1;for(let i=LG.length-1;i>=0;i--)if(LG[i].k===k){LG.splice(i,1);break}}
  else{p.s[k]+=1;LG.push({k,c:fmt(S.timer.left)})}
  save();keepRender();
}
function sheet(){
  const p=S.detail&&P(S.detail);if(!p)return"";
  const t=totals(p.s),L=p.log||[];
  const sum=[["نقاط",t.pts],["ريبوند",t.reb],["تمريرات",t.as],["سرقات",t.st],["أخطاء",t.pf],["Turnover",t.to],["2 نقطة",t.m2+"/"+t.a2],["3 نقاط",t.m3+"/"+t.a3],["رميات حرة",t.ftm+"/"+t.aft]];
  const eds=PAD.filter(Boolean).map(b=>`<div class="ed ${b[3]}"><span>${b[1]} ${b[2]}</span><button onclick="adjStat(${p.id},'${b[0]}',-1)" aria-label="إنقاص">−</button><b>${p.s[b[0]]||0}</b><button onclick="adjStat(${p.id},'${b[0]}',1)" aria-label="زيادة">+</button></div>`).join("");
  const rows=L.map((e,i)=>`<div class="lg ${lcls(e.k)}"><b>${lbl(e.k)}</b><span>⏱ ${e.c}</span><button onclick="undoLog(${p.id},${i})" aria-label="حذف التسجيل">✕</button></div>`).reverse().join("");
  return `<div class="sheet-bg" onclick="closeP()"><div class="sheet" onclick="event.stopPropagation()"><h2>${esc(p.no)||""} ${esc(p.name)||"لاعب"}<button class="x" onclick="closeP()">✕</button></h2><div class="ssum">${sum.map(a=>`<div><span>${a[0]}</span><b>${a[1]}</b></div>`).join("")}</div><h3 class="eh">تعديل الأعداد (لتصحيح أي رقم)</h3><div class="eds">${eds}</div><div class="slog"><h3>اللي عمله بالترتيب (الأحدث فوق)</h3>${rows||'<div class="hint">لسه مفيش تسجيلات. التسجيلات القديمة قبل التحديث مش ظاهرة هنا.</div>'}<div class="hint">لو سجلت حاجة غلط، دوس ✕ جنبها وهتتمسح وتتنقص من الإحصائيات.</div></div></div></div>`;
}

function ask(msg,def,cb){
  const old=document.getElementById("dlg");if(old)old.remove();
  const d=document.createElement("div");d.id="dlg";d.className="sheet-bg dlgbg";
  d.innerHTML='<div class="dlg"><p></p>'+(def!==null?'<input id="dlgi">':'')+'<div class="row"><button class="btn" id="dlgok">تأكيد</button><button class="btn g" id="dlgno">إلغاء</button></div></div>';

/* ===== drag an action button onto a player ===== */
let DR=null;
function cardAt(x,y){const el=document.elementFromPoint(x,y);return el&&el.closest?el.closest(".pc[data-pid]"):null}
function toast(t){let e=document.getElementById("toast");if(!e){e=document.createElement("div");e.id="toast";document.body.appendChild(e)}e.textContent=t;e.style.opacity=1;clearTimeout(e._t);e._t=setTimeout(()=>{e.style.opacity=0},1400)}
function dragStart(ev,k){
  if(DR)return;ev.preventDefault();
  const b=PAD.find(x=>x&&x[0]===k),src=ev.currentTarget;
  const g=document.createElement("div");g.className="ghost "+(b[3]||"");g.innerHTML="<small>"+b[1]+"</small><span>"+b[2]+"</span>";
  document.body.appendChild(g);
  DR={k,b,g,hot:null,src,id:ev.pointerId};
  src.classList.add("drag");
  try{src.setPointerCapture(ev.pointerId)}catch(e){}
  dragMove(ev);
  window.addEventListener("pointermove",dragMove);
  window.addEventListener("pointerup",dragEnd);
  window.addEventListener("pointercancel",dragCancel);
}
function dragMove(ev){
  if(!DR)return;
  const x=ev.clientX,y=ev.clientY-56;
  DR.g.style.left=x+"px";DR.g.style.top=y+"px";
  const c=cardAt(x,y);
  if(DR.hot!==c){if(DR.hot)DR.hot.classList.remove("hot","hotm");if(c)c.classList.add(S.mode==="-"?"hotm":"hot");DR.hot=c}
}
function dragClean(){
  if(!DR)return;
  window.removeEventListener("pointermove",dragMove);
  window.removeEventListener("pointerup",dragEnd);
  window.removeEventListener("pointercancel",dragCancel);
  if(DR.hot)DR.hot.classList.remove("hot","hotm");
  DR.src.classList.remove("drag");DR.g.remove();
}
function dragCancel(){dragClean();DR=null}
function dragEnd(ev){
  if(!DR)return;
  const x=ev.clientX,y=ev.clientY-56,c=cardAt(x,y),k=DR.k,b=DR.b;
  dragClean();DR=null;
  if(!c){toast("سيب الزرار فوق اللاعب");return}
  const id=+c.getAttribute("data-pid"),pl=P(id);if(!pl)return;
  const LG=pl.log||(pl.log=[]);
  if(S.mode==="-"){pl.s[k]=Math.max(0,pl.s[k]-1);for(let i=LG.length-1;i>=0;i--)if(LG[i].k===k){LG.splice(i,1);break}}
  else{pl.s[k]+=1;LG.push({k,c:fmt(S.timer.left)});if(LG.length>300)LG.shift()}
  save();render();
  const n=document.querySelector('.pc[data-pid="'+id+'"]');
  if(n){n.classList.add(S.mode==="-"?"flashm":"flash");setTimeout(()=>n.classList.remove("flash","flashm"),450)}
  toast((S.mode==="-"?"➖ ":"✅ ")+b[1]+" "+b[2]+" ← "+(pl.no||"")+" "+(pl.name||""));
}

function makePDF(jpgs,w,h){
  const enc=new TextEncoder(),parts=[],offs=[];let len=0;
  const push=b=>{const u=typeof b==="string"?enc.encode(b):b;parts.push(u);len+=u.length};
  const obj=(n,fn)=>{offs[n]=len;push(n+" 0 obj\n");fn();push("\nendobj\n")};
  const n=jpgs.length,total=2+3*n;
  push("%PDF-1.4\n");
  obj(1,()=>push("<</Type/Catalog/Pages 2 0 R>>"));
  obj(2,()=>push(`<</Type/Pages/Count ${n}/Kids[${jpgs.map((_,i)=>(3+3*i)+" 0 R").join(" ")}]>>`));
  jpgs.forEach((jb,i)=>{
    const pg=3+3*i,c=pg+1,im=pg+2,s="q 842 0 0 595 0 0 cm /Im0 Do Q";
    obj(pg,()=>push(`<</Type/Page/Parent 2 0 R/MediaBox[0 0 842 595]/Resources<</XObject<</Im0 ${im} 0 R>>>>/Contents ${c} 0 R>>`));
    obj(c,()=>push(`<</Length ${s.length}>>\nstream\n${s}\nendstream`));
    obj(im,()=>{push(`<</Type/XObject/Subtype/Image/Width ${w}/Height ${h}/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length ${jb.length}>>\nstream\n`);push(jb);push("\nendstream")});
  });
  const x=len;push(`xref\n0 ${total+1}\n0000000000 65535 f \n`);
  for(let i=1;i<=total;i++)push(String(offs[i]).padStart(10,"0")+" 00000 n \n");
  push(`trailer\n<</Size ${total+1}/Root 1 0 R>>\nstartxref\n${x}\n%%EOF`);
  return new Blob(parts,{type:"application/pdf"});
}
async function exportPDF(){
  if(!S.players.length){toast("ضيف لاعبين الأول");return}
  const tt=totals(teamS()),rows=allRows();
  const W=2200,HH=1556,M=40,RH=64,HDR=90,top=190,per=Math.floor((HH-top-HDR-30)/RH);
  const cw=[90,260].concat(Array(19).fill(93));
  const pages=[];
  for(let st=0;st<rows.length;st+=per){
    const cv=document.createElement("canvas");cv.width=W;cv.height=HH;
    const g=cv.getContext("2d");g.direction="rtl";g.textAlign="center";g.textBaseline="middle";
    g.fillStyle="#fff";g.fillRect(0,0,W,HH);g.fillStyle="#000";
    g.textAlign="right";g.font="bold 46px sans-serif";g.fillText(S.fname||"إحصائيات",W-M,60);
    g.font="26px sans-serif";g.fillStyle="#444";
    g.fillText(`${new Date().toLocaleDateString("ar-EG")}  |  التسديد ${pct(tt.fgm,tt.fga)}  |  النقطتين ${pct(tt.m2,tt.a2)}  |  الثلاثية ${pct(tt.m3,tt.a3)}  |  الحرة ${pct(tt.ftm,tt.aft)}`,W-M,120);
    g.textAlign="center";
    const cell=(i,y,h,txt,bg,font)=>{
      let xr=W-M;for(let k=0;k<i;k++)xr-=cw[k];
      g.fillStyle=bg;g.fillRect(xr-cw[i],y,cw[i],h);g.strokeStyle="#444";g.lineWidth=2;g.strokeRect(xr-cw[i],y,cw[i],h);
      g.fillStyle="#000";g.font=font;
      const ls=String(txt).split(" ");const lh=26;
      ls.forEach((l,j)=>g.fillText(l,xr-cw[i]/2,y+h/2+(j-(ls.length-1)/2)*lh));
    };
    H.forEach((h,i)=>cell(i,top,HDR,h,"#e9e9e9","bold 22px sans-serif"));
    rows.slice(st,st+per).forEach((r,j)=>{
      const last=(st+j===rows.length-1);
      r.forEach((v,i)=>cell(i,top+HDR+j*RH,RH,v,last?"#f0f0f0":"#fff",(last?"bold ":"")+"28px sans-serif"));
    });
    const b64=cv.toDataURL("image/jpeg",0.92).split(",")[1],bin=atob(b64),u=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
    pages.push(u);
  }
  const blob=makePDF(pages,W,HH),nm=fname()+".pdf";
  const file=new File([blob],nm,{type:"application/pdf"});
  try{
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:S.fname});return}
  }catch(e){if(e&&e.name==="AbortError")return}
  const url=URL.createObjectURL(blob),a=document.createElement("a");
  a.href=url;a.download=nm;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),60000);
}
render();
(async()=>{
  try{
    if(!window.claude||!claude.use)return;
    const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(!db||!user)return;
    const id=await user.id();if(!id)return;
    const d=db.collection("data/users/"+id).doc("bara3em");
    const snap=await d.get();
    let localAt=0;try{localAt=+localStorage.getItem("bara3em_at")||0}catch(e){}
    if(snap.exists){
      const v=snap.data();
      if(v&&typeof v.json==="string"&&(v.at||0)>localAt){
        const x=JSON.parse(v.json);
        if(x&&Array.isArray(x.players)){Object.assign(S,x);norm();try{localStorage.setItem("bara3em",JSON.stringify(S));localStorage.setItem("bara3em_at",String(v.at))}catch(e){}render()}
      }else if(localAt>(v&&v.at||0)){await d.set({json:JSON.stringify(S),at:localAt})}
    }else if(S.players.length){await d.set({json:JSON.stringify(S),at:localAt||Date.now()})}
    cloudDoc=d;
  }catch(e){}
})();
</script>
